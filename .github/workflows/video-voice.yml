name: Video voice (ElevenLabs)

# Озвучивает _src/video/script.txt и коммитит voice.mp3 + alignment.json.
# Запуск: изменить _src/video/run.txt или вручную.
on:
  push:
    branches: [main]
    paths: ["_src/video/run.txt", "_src/video/script.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 _src/video/voice.py
      - name: Save
        run: |
          git add _src/video/voice.mp3 _src/video/alignment.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -m "Озвучка видеоинструкции [no-post]"
          git pull --rebase --autostash origin main && git push origin HEAD:main
