name: Site availability from Russia

# Каждые 2 часа проверяет из России основной и запасные адреса сайта.
# Если основной заблокирован, пишет в канал рабочий адрес. Сайт сам переключает людей (failover в каждой странице).
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: python3 _src/hosts_watch.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f _src/data/hosts.json ] || exit 0
          git add _src/data/hosts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Доступность адресов из России [no-post]"
          for i in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
