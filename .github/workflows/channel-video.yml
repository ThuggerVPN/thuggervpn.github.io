name: Channel video post

# Публикует видеоинструкцию в канал. Запуск: изменить _src/video/post_ru.txt (или вручную).
# Не трогает _src/channel/ и закреплённый пост.
on:
  push:
    branches: [main]
    paths: ["_src/video/post_ru.txt"]
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send video
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHANNEL" ]; then echo "Нет секретов"; exit 1; fi
          curl -sS "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendVideo" \
            -F chat_id="$TG_CHANNEL" -F video=@_src/video/guide_ru_tg.mp4 -F thumbnail=@_src/video/thumb_ru.jpg \
            -F width=720 -F height=1280 -F duration=79 -F supports_streaming=true -F parse_mode=HTML \
            -F caption="<_src/video/post_ru.html" \
            | python3 -c "import sys,json;r=json.load(sys.stdin);print('ok, message', r['result']['message_id']) if r.get('ok') else (print(r), sys.exit(1))"
