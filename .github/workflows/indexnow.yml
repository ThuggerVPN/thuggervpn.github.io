name: IndexNow ping (Bing)

on:
  push:
    branches: [main]
    paths: ["sitemap.xml"]
  workflow_dispatch:

# Только чтение репозитория: этот запуск ничего не коммитит.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Send sitemap URLs to IndexNow
        run: |
          KEY=$(python3 -c "import json;print(json.load(open('_src/config.json'))['indexnow_key'])")
          SITE=$(python3 -c "import json;print(json.load(open('_src/config.json'))['site_url'])")
          HOST=${SITE#https://}
          URLS=$(python3 - <<'PY'
          import json, re
          xml = open("sitemap.xml", encoding="utf-8").read()
          print(json.dumps(re.findall(r"<loc>(.*?)</loc>", xml)))
          PY
          )
          BODY=$(printf '{"host":"%s","key":"%s","keyLocation":"%s/%s.txt","urlList":%s}' "$HOST" "$KEY" "$SITE" "$KEY" "$URLS")
          echo "$BODY"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" https://api.indexnow.org/indexnow
