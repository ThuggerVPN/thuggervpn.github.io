name: Telegram channel title

# Меняет название и описание канала, когда меняется _src/channel/title.txt или description.txt.
# Закреплённый пост и аватарку не трогает (это делает channel-setup по run.txt).
on:
  push:
    branches: [main]
    paths: ["_src/channel/title.txt", "_src/channel/description.txt"]
  workflow_dispatch:

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set title and description
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
        run: |
          API="https://api.telegram.org/bot${TG_BOT_TOKEN}"
          T=$(head -n1 _src/channel/title.txt)
          R1=$(curl -sS --data-urlencode chat_id="$TG_CHANNEL" --data-urlencode title="$T" "$API/setChatTitle"); echo "$R1"
          R2=$(curl -sS --data-urlencode chat_id="$TG_CHANNEL" --data-urlencode description@_src/channel/description.txt "$API/setChatDescription"); echo "$R2"
          OK=$(echo "$R1" | python3 -c "import sys,json;print(json.load(sys.stdin).get('ok'))")
          if [ "$OK" = "True" ]; then MSG="Канал переименован: $T"; else MSG="Не удалось переименовать канал: $R1"; fi
          TG_BOT_TOKEN="$TG_BOT_TOKEN" python3 _src/notify/notify.py "$MSG" || true
