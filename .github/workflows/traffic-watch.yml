name: Traffic watch (GoatCounter)

# Раз в час собирает посещения, клики «в бота» и всплески в _src/data/traffic.json.
# Этот файл читают радар спроса, ежедневный прогон и недельный отчёт.
# Секрет GOATCOUNTER_TOKEN необязателен: с ним добавляются источники переходов.
on:
  push:
    branches: [main]
    paths: ["_src/traffic_watch.py", ".github/workflows/traffic-watch.yml"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-write
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          pip install -q pynacl
          python3 _src/traffic_watch.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _src/data/traffic.json _src/notify/owner.json _src/notify/pubkey.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Трафик сайта [no-post]"
          for i in 1 2 3; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
